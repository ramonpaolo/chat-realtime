name: PR checks

on:
  pull_request:
    types:
      - opened
      - synchronize

env:
  IMAGE: r4deu51/chat-realtime-anonymous-stg
  TAG: ${{ github.sha }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Run tests
        run: yarn test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Config QEMU
        uses: docker/setup-qemu-action@v3.2.0
        with:
          platforms: linux/amd64

      - name: Config Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1
        with:
          platforms: linux/amd64

      - name: Login in Docker Registry
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Publish Image to Docker
        run: make deploy IMAGE=${{ env.IMAGE }} TAG=${{ env.TAG }}

  deploy:
    needs: [build, test]
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Login in Docker Registry
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run container smoke test
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ env.TAG }}
        run: |
          docker run -d --name chat-realtime-smoke -p 3000:3000 "$IMAGE_REF"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              echo "healthcheck ok"
              exit 0
            fi
            sleep 2
          done
          echo "healthcheck failed"
          docker logs chat-realtime-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f chat-realtime-smoke || true
